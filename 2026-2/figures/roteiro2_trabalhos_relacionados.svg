<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_r2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="acc_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="acc_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow_r2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg_r2)"/>
  <circle cx="720" cy="70" r="140" fill="#06b6d4" opacity="0.08"/>
  <circle cx="80" cy="380" r="160" fill="#10b981" opacity="0.06"/>

  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M160 0 V450 M320 0 V450 M480 0 V450 M640 0 V450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Top Badge -->
  <rect x="50" y="45" width="200" height="32" rx="16" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="150" y="66" fill="#a7f3d0" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">ROTEIRO PRÁTICO #02</text>

  <text x="50" y="125" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="32" font-weight="800">Trabalhos Relacionados &amp; Fichamento</text>
  <text x="50" y="158" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="500">SBC OpenLib (COTB) • Tripé de Análise • Tabela Comparativa • BibTeX</text>

  <!-- Content 3 Cards -->
  <g filter="url(#shadow_r2)">
    <!-- Card 1: Tripé de Análise -->
    <rect x="50" y="195" width="220" height="205" rx="12" fill="#0c1e17" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="90" cy="235" r="18" fill="url(#acc_green)"/>
    <path d="M83 235 L88 240 L97 230" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="120" y="240" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700">Tripé de Análise</text>
    
    <rect x="70" y="265" width="180" height="36" rx="6" fill="#133827"/>
    <text x="80" y="282" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="700">1. O que fizeram?</text>
    <text x="80" y="295" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Proposta e objetivo real</text>

    <rect x="70" y="308" width="180" height="36" rx="6" fill="#133827"/>
    <text x="80" y="325" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="700">2. Como fizeram?</text>
    <text x="80" y="338" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Tecnologias e métodos</text>

    <rect x="70" y="351" width="180" height="36" rx="6" fill="#133827"/>
    <text x="80" y="368" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">3. Diferencial do seu projeto</text>
    <text x="80" y="381" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">O que o seu software inova</text>

    <!-- Card 2: Fórmula do Parágrafo -->
    <rect x="290" y="195" width="220" height="205" rx="12" fill="#0c1e17" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="330" cy="235" r="18" fill="url(#acc_cyan)"/>
    <path d="M323 235 H337 M323 229 H337 M323 241 H333" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="360" y="240" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700">Fórmula de Redação</text>

    <rect x="310" y="265" width="180" height="50" rx="6" fill="#0e3b38"/>
    <text x="320" y="285" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">"No trabalho de Silva (2023)..."</text>
    <text x="320" y="303" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Citação + Resumo crítico</text>

    <rect x="310" y="325" width="180" height="60" rx="6" fill="#082f49"/>
    <text x="320" y="345" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">"Diferente dessa abordagem..."</text>
    <text x="320" y="362" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Destaque da sua solução web</text>
    <text x="320" y="375" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">mobile-first para o IFSC</text>

    <!-- Card 3: SOL COTB & BibTeX -->
    <rect x="530" y="195" width="220" height="205" rx="12" fill="#0c1e17" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="570" cy="235" r="18" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="570" y="240" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">.bib</text>
    <text x="600" y="240" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700">COTB &amp; BibTeX</text>

    <rect x="550" y="265" width="180" height="34" rx="6" fill="#133827"/>
    <text x="640" y="286" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">SBC OpenLib (SOL COTB)</text>

    <rect x="550" y="308" width="180" height="34" rx="6" fill="#133827"/>
    <text x="640" y="329" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">\cite{silva2023}</text>

    <rect x="550" y="352" width="180" height="32" rx="16" fill="url(#acc_green)"/>
    <text x="640" y="372" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">2 Trabalhos Fichados</text>
  </g>
</svg>
    <text x="640" y="293" fill="#f3e8ff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Computer on the Beach</text>
    <rect x="550" y="315" width="180" height="28" rx="6" fill="#581c87"/>
    <text x="640" y="333" fill="#f3e8ff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SEPEI &amp; SNCT IFSC</text>
    <rect x="550" y="355" width="180" height="24" rx="12" fill="url(#accent4)"/>
    <text x="640" y="371" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Defesa Demonstrativa</text>

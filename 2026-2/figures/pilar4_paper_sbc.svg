  <g filter="url(#shadow4)">
    <!-- Card 1: Overleaf Paper -->
    <rect x="50" y="200" width="215" height="195" rx="12" fill="#24103d" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="75" y="225" width="165" height="85" rx="6" fill="#3b1768" stroke="#a78bfa" stroke-width="1"/>
    <rect x="85" y="238" width="145" height="8" rx="4" fill="#c084fc" fill-opacity="0.8"/>
    <rect x="85" y="254" width="90" height="6" rx="3" fill="#c084fc" fill-opacity="0.5"/>

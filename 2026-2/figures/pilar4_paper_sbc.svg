  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bg4)"/>
  <circle cx="700" cy="80" r="140" fill="#a855f7" opacity="0.12"/>
  <circle cx="100" cy="380" r="180" fill="#c084fc" opacity="0.06"/>
  
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M160 0 V450 M320 0 V450 M480 0 V450 M640 0 V450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <rect x="50" y="45" width="130" height="32" rx="16" fill="#7c3aed" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.5"/>

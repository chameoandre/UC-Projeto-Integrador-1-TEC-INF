    <rect x="290" y="200" width="215" height="195" rx="12" fill="#24103d" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="320" cy="235" r="12" fill="#10b981"/>
    <text x="320" y="239" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" text-anchor="middle">C1</text>
    <text x="342" y="239" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Experimentação Mínima</text>

    <circle cx="320" cy="275" r="12" fill="#0284c7"/>

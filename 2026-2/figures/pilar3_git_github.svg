<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bg3)"/>
  <circle cx="700" cy="80" r="140" fill="#6366f1" opacity="0.12"/>
  <circle cx="100" cy="380" r="180" fill="#a855f7" opacity="0.06"/>
  
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M160 0 V450 M320 0 V450 M480 0 V450 M640 0 V450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <rect x="50" y="45" width="130" height="32" rx="16" fill="#6366f1" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="115" y="66" fill="#c084fc" font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">PILAR 03</text>
  
  <text x="50" y="125" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="34" font-weight="800">Versionamento &amp; GitHub Pages</text>
  <text x="50" y="160" fill="#ddd6fe" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500">Controle Git • Branches • Pull Requests • Deploy Contínuo</text>

  <g filter="url(#shadow3)">
    <!-- Card 1: Git Tree -->
    <rect x="50" y="200" width="215" height="195" rx="12" fill="#1e1e38" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Git Nodes -->
    <circle cx="85" cy="245" r="8" fill="#818cf8"/>
    <circle cx="135" cy="245" r="8" fill="#818cf8"/>
    <circle cx="185" cy="245" r="8" fill="#34d399"/>
    <line x1="93" y1="245" x2="127" y2="245" stroke="#818cf8" stroke-width="3"/>
    <line x1="143" y1="245" x2="177" y2="245" stroke="#818cf8" stroke-width="3"/>
    <!-- Branch -->
    <path d="M90 250 Q110 290 135 290 H185" stroke="#c084fc" stroke-width="3" fill="none"/>
    <circle cx="135" cy="290" r="8" fill="#c084fc"/>
    <circle cx="185" cy="290" r="8" fill="#c084fc"/>
    <text x="65" y="345" fill="#c084fc" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="700">Commits Semânticos</text>
    <text x="65" y="370" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="11">feat:, fix:, docs:, chore:</text>

    <!-- Card 2: Repositório Estruturado -->
    <rect x="290" y="200" width="215" height="195" rx="12" fill="#1e1e38" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="310" y="225" width="175" height="26" rx="6" fill="#312e81"/>
    <text x="325" y="242" fill="#e0e7ff" font-family="'Fira Code', monospace" font-size="11">📁 docs/</text>
    <rect x="310" y="260" width="175" height="26" rx="6" fill="#312e81"/>
    <text x="325" y="277" fill="#e0e7ff" font-family="'Fira Code', monospace" font-size="11">📁 src/</text>
    <rect x="310" y="295" width="175" height="26" rx="6" fill="#312e81"/>
    <text x="325" y="312" fill="#e0e7ff" font-family="'Fira Code', monospace" font-size="11">📄 README.md</text>
    <text x="305" y="355" fill="#c084fc" font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="700">Repositório Público</text>
    <text x="305" y="375" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="11">Padronização IFSC</text>

    <!-- Card 3: Deploy Pages -->
    <rect x="530" y="200" width="220" height="195" rx="12" fill="#1e1e38" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="570" cy="240" r="20" fill="url(#accent3)"/>
    <path d="M560 242 A10 10 0 0 1 578 238 A8 8 0 0 1 582 246 H560 Z" fill="#ffffff"/>
    <text x="602" y="246" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700">GitHub Pages</text>
    <rect x="550" y="275" width="180" height="28" rx="6" fill="#3730a3"/>
    <text x="640" y="293" fill="#e0e7ff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Deploy Estático Web</text>
    <rect x="550" y="315" width="180" height="28" rx="6" fill="#3730a3"/>
    <text x="640" y="333" fill="#e0e7ff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">URL Pública (.github.io)</text>
    <rect x="550" y="355" width="180" height="24" rx="12" fill="url(#accent3)"/>
    <text x="640" y="371" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Documentação Viva</text>
  </g>
</svg>